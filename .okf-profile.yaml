# .okf-profile.yaml — AOS OKF Profile
# Conforms to the generic okf-mcp profile schema.
# Defines document-level concept types, canonical heading relationships, and
# graph invariants for the Agentic OS traceable specification pipeline.
name: aos
version: "1.0"

concept_types:
  - name: anchor
  - name: requirement
  - name: requirement-index
  - name: decision
  - name: design
  - name: spec
  - name: plan

relationships:
  - name: derived-from
    heading_aliases:
      - Derived from
    inverse: derives
    allowed_source_types:
      - requirement
    allowed_target_types:
      - anchor

  - name: satisfies
    heading_aliases:
      - Satisfies
    inverse: satisfied-by
    allowed_source_types:
      - decision
      - design
      - spec
    allowed_target_types:
      - requirement

  - name: implements
    heading_aliases:
      - Implements
    inverse: implemented-by
    allowed_source_types:
      - spec
      - plan
    allowed_target_types:
      - decision
      - design
      - spec

  - name: verified-by
    heading_aliases:
      - Verified by
    inverse: verifies
    allowed_source_types:
      - requirement
    allowed_target_types:
      - plan
      - spec

  - name: depends-on
    heading_aliases:
      - Depends on
    inverse: depended-on-by
    allowed_source_types:
      - anchor
      - requirement
      - requirement-index
      - decision
      - design
      - spec
      - plan
    allowed_target_types:
      - anchor
      - requirement
      - requirement-index
      - decision
      - design
      - spec
      - plan

  - name: supersedes
    heading_aliases:
      - Supersedes
    inverse: superseded-by
    allowed_source_types:
      - anchor
      - requirement
      - decision
      - design
      - spec
      - plan
    allowed_target_types:
      - anchor
      - requirement
      - decision
      - design
      - spec
      - plan

invariants:
  - id: requirement-has-source
    description: Every requirement node must have at least one outgoing derived-from edge
    source_type: requirement
    relationship: derived-from
    direction: outgoing
    min: 1
    max: -1
    severity: error
